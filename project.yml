            UTTypeTagSpecification:
              public.filename-extension: [nupkg]
          - UTTypeIdentifier: com.microsoft.vsix
            UTTypeDescription: Visual Studio Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vsix]
    entitlements:
      path: App/macOS/KernirMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Without it the sandbox quarantines every file the app writes (archives it creates, items it
        # extracts: 0082;…;Lutik), and Gatekeeper then won't open them. QuarantinePropagation keeps a
        # downloaded archive's quarantine on what is extracted from it.
        com.apple.security.files.user-selected.executable: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: Lutik
        # The module stays Kernir: `@testable import Kernir` and $(PRODUCT_MODULE_NAME) plist classes.
        PRODUCT_MODULE_NAME: Kernir
        SWIFT_EMIT_LOC_STRINGS: YES
        # Debug builds get com.kernir.app.dev so Xcode's automatic Launch Services
        # registration of every build cannot shadow the installed app's IDs.
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app$(KERNIR_BUNDLE_ID_SUFFIX)
        KERNIR_BUNDLE_ID_SUFFIX: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          KERNIR_BUNDLE_ID_SUFFIX: .dev

  KernirMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/KernirMacTests]
    dependencies:
      # No KernirCore here: the tests use the host app's copy through BUNDLE_LOADER. Linking it
      # again loads a second copy when the app was relinked by another scheme's build, and then
      # `ArchiveError` doesn't match `ArchiveError`.
      - target: KernirMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.tests
        # Support/TestBundleSetup.swift: turns window frame autosaving off before any test runs.
        INFOPLIST_KEY_NSPrincipalClass: KernirMacTestsSetup
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lutik.app/Contents/MacOS/Lutik
        BUNDLE_LOADER: $(TEST_HOST)

  # ---- macOS UI tests ----
  # CI ONLY. These drive the real keyboard and mouse; never run them on a developer's Mac
  # (no desktop automation). Locally: build-for-testing only.
  # Own scheme, not in KernirMac's test action; every test skips unless the runner has
  # KERNIR_MAC_UI_TESTS=1 (CI passes TEST_RUNNER_KERNIR_MAC_UI_TESTS=1).
  KernirMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/KernirMacUITests]
    dependencies:
      - target: KernirMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.mac.uitests
    # Scheme: top-level `schemes:` at the end (the target-level block can't set attachments).

  # ---- iOS app ----
  KernirIOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: KernirCore
      - target: KernirQuickLookIOS
        embed: true
      - target: KernirThumbnailIOS
        embed: true
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Lutik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KernirGitCommit: $(KERNIR_GIT_COMMIT)   # About: "Version 0.1.0 (<build>, <commit>)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserActivityTypes:
          - com.kernir.app.open-archive
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        CFBundleDocumentTypes:
          - CFBundleTypeName: Editable Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            UIDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-tar-archive
              - public.tar-bzip2-archive
              - org.tukaani.tar-xz-archive
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            UIDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes:
              - com.rarlab.rar-archive
              - com.kernir.archive-volume
              - org.gnu.gnu-tar-archive
              - org.gnu.gnu-zip-archive
              - public.bzip2-archive
              - org.tukaani.xz-archive
              - com.facebook.zst-archive
              - public.iso-image
              - public.cpio-archive
              - com.apple.xar-archive
              - com.microsoft.cab
              - cx.c3.lha-archive
              - com.sun.java-archive
              - com.sun.web-application-archive
              - com.sun.enterprise-archive
              - com.android.package-archive
              - com.android.app-bundle
              - org.mozilla.xpinstall
              - org.python.wheel
              - org.nuget.package
              - com.microsoft.vsix
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *rarExtensions
          - UTTypeIdentifier: com.kernir.archive-volume
            UTTypeDescription: Split Archive Part
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *volumeExtensions
          - UTTypeIdentifier: com.facebook.zst-archive
            UTTypeDescription: Zstandard Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zst, tzst]
          - UTTypeIdentifier: public.iso-image
            UTTypeDescription: ISO Disk Image
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [iso]
          - UTTypeIdentifier: cx.c3.lha-archive
            UTTypeDescription: LHA Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lha, lzh]
          - UTTypeIdentifier: com.sun.enterprise-archive
            UTTypeDescription: Java Enterprise Archive
            UTTypeConformsTo: [public.zip-archive, public.data, com.sun.java-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ear]
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [apk]
              public.mime-type: application/vnd.android.package-archive
          - UTTypeIdentifier: com.android.app-bundle
            UTTypeDescription: Android App Bundle
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aab]
          - UTTypeIdentifier: org.mozilla.xpinstall
            UTTypeDescription: Mozilla Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xpi]
              public.mime-type: application/x-xpinstall
          - UTTypeIdentifier: org.python.wheel
            UTTypeDescription: Python Wheel
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [whl]
          - UTTypeIdentifier: org.nuget.package
            UTTypeDescription: NuGet Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nupkg]
          - UTTypeIdentifier: com.microsoft.vsix
            UTTypeDescription: Visual Studio Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vsix]
    settings:
      base:
        PRODUCT_NAME: Lutik
        # The module stays Kernir: `@testable import Kernir` and $(PRODUCT_MODULE_NAME) plist classes.
        PRODUCT_MODULE_NAME: Kernir
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - KernirIOSTests
        - KernirIOSUITests

  KernirIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KernirIOSTests
      # App/Shared logic, shared with KernirMacTests: the Text Encoding titles on iOS's own Foundation.
      # A file under Tests/KernirMacTests: moving or renaming it breaks the iOS project generation.
      - Tests/KernirMacTests/ArchiveNameEncodingTitleTests.swift
      - Tests/KernirMacTests/NestedArchiveTests.swift
      # Throwaway defaults suites whose plists stay in the temporary folder (Foundation only).
      - Tests/KernirMacTests/Support/TestDefaults.swift
    dependencies:
      - target: KernirIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's PRODUCT_NAME is "Lutik", not the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lutik.app/Lutik
        BUNDLE_LOADER: $(TEST_HOST)

  KernirIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/KernirIOSUITests
