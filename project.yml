            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.apple.xar-archive]
            CFBundleTypeIconFile: DocIcon-other
