            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.tukaani.xz-archive]
            CFBundleTypeIconFile: DocIcon-xz
          - CFBundleTypeName: Zstandard Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.facebook.zst-archive]
            CFBundleTypeIconFile: DocIcon-tar-zst
          - CFBundleTypeName: ISO Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.iso-image]
            CFBundleTypeIconFile: DocIcon-iso
          - CFBundleTypeName: CPIO Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.cpio-archive]
            CFBundleTypeIconFile: DocIcon-cpio
