            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.microsoft.cab]
            CFBundleTypeIconFile: DocIcon-cab
          - CFBundleTypeName: LHA Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [cx.c3.lha-archive]
            CFBundleTypeIconFile: DocIcon-other
          - CFBundleTypeName: Java Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.sun.java-archive]
            CFBundleTypeIconFile: DocIcon-jar
          - CFBundleTypeName: Web Application Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.sun.web-application-archive]
            CFBundleTypeIconFile: DocIcon-jar
          - CFBundleTypeName: Java Enterprise Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.sun.enterprise-archive]
            CFBundleTypeIconFile: DocIcon-jar
          - CFBundleTypeName: Android Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.android.package-archive]
            CFBundleTypeIconFile: DocIcon-apk
          - CFBundleTypeName: Android App Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.android.app-bundle]
            CFBundleTypeIconFile: DocIcon-apk
          - CFBundleTypeName: Mozilla Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.mozilla.xpinstall]
            CFBundleTypeIconFile: DocIcon-xpi
          - CFBundleTypeName: Python Wheel
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.python.wheel]
            CFBundleTypeIconFile: DocIcon-whl
          - CFBundleTypeName: NuGet Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.nuget.package]
            CFBundleTypeIconFile: DocIcon-nupkg
          - CFBundleTypeName: Visual Studio Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.microsoft.vsix]
            CFBundleTypeIconFile: DocIcon-vsix
          # Rank None, no NSDocumentClass: Kernir is no Open With choice for plain files and never a
          # default; the type exists so the Dock icon accepts plain-file drops (LSCanURLAcceptURL;
          # new archive window). A user can still pick Kernir via Open With > Other… (all
          # apps); "Always Open With" then opens a new unsaved archive window holding the file with
          # the Save sheet (not a compress). Tests: launchServicesOffersKernirForNoPlainItem.
          - CFBundleTypeName: File or Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
