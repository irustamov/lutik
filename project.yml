name: Kernir
options:
  bundleIdPrefix: com.kernir.app
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  # Build number (commit count) and commit for About: writes App/Version.generated.xcconfig.
  preGenCommand: /bin/bash scripts/build/stamp-version.sh
# Project-level base configuration: CURRENT_PROJECT_VERSION and KERNIR_GIT_COMMIT (stamped by the above).
configFiles:
  Debug: App/Version.xcconfig
  Release: App/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""   # set for release builds; empty = local ad-hoc builds
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KernirCore:
    path: Packages/KernirCore

targets:
  # ---- macOS app ----
  KernirMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    scheme:
      testTargets: [KernirMacTests]
    dependencies:
      - package: KernirCore
      - target: KernirQuickLookMac
        embed: true
      - target: KernirThumbnailMac
        embed: true
    postBuildScripts:   # Mac document icons (DocIcon-<art>.icns), built from the 1024 masters, never committed
      - name: Document icons
        script: /bin/bash "$SRCROOT/scripts/brand/make-doc-icons.sh"
        inputFileLists: [$(SRCROOT)/scripts/brand/doc-icons-inputs.xcfilelist]
        outputFileLists: [$(SRCROOT)/scripts/brand/doc-icons-outputs.xcfilelist]
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Lutik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        KernirGitCommit: $(KERNIR_GIT_COMMIT)   # About: "Version 0.1.0 (<build>, <commit>)"
        NSPrincipalClass: NSApplication
        # Finder Services. NSMessage names ServicesProvider's @objc methods
        # extractHere(_:userData:error:) and compress(_:userData:error:); Extract Here's types are
        # KernirDocumentTypes.identifiers plus .jar and .whl (ServicesRequest.extractablePackages).
        # Tests/KernirMacTests/ServicesInfoPlistTests.swift checks both.
        NSServices:
          - NSMenuItem:
              default: Extract Here with Lutik
            NSMessage: extractHere
            NSPortName: Lutik
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - com.facebook.zst-archive
              - public.iso-image
              - public.cpio-archive
              - com.apple.xar-archive
              - com.microsoft.cab
              - cx.c3.lha-archive
              - com.kernir.archive-volume
              - com.sun.java-archive
              - org.python.wheel
          - NSMenuItem:
              default: Compress with Lutik
            NSMessage: compress
            NSPortName: Lutik
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
        # Archives (KernirDocumentTypes.identifiers): Editor when writable, Viewer otherwise.
        # Zip-based developer packages (KernirDocumentTypes.packageTypes): Viewer, Alternate.
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.zip-archive]
            CFBundleTypeIconFile: DocIcon-zip
          - CFBundleTypeName: 7-Zip Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.7-zip.7-zip-archive]
            CFBundleTypeIconFile: DocIcon-7z
          - CFBundleTypeName: TAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.tar-archive]
            CFBundleTypeIconFile: DocIcon-tar
          - CFBundleTypeName: Gzip TAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.gnu.gnu-zip-tar-archive]
            CFBundleTypeIconFile: DocIcon-tar-gz
          - CFBundleTypeName: Bzip2 TAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.tar-bzip2-archive]
            CFBundleTypeIconFile: DocIcon-tar-bz2
          - CFBundleTypeName: XZ TAR Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.tukaani.tar-xz-archive]
            CFBundleTypeIconFile: DocIcon-tar-xz
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.rarlab.rar-archive]
            CFBundleTypeIconFile: DocIcon-rar
          - CFBundleTypeName: Split Archive Part
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [com.kernir.archive-volume]
            CFBundleTypeIconFile: DocIcon-other
          - CFBundleTypeName: GNU TAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.gnu.gnu-tar-archive]
            CFBundleTypeIconFile: DocIcon-tar
          - CFBundleTypeName: Gzip Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [org.gnu.gnu-zip-archive]
            CFBundleTypeIconFile: DocIcon-gz
          - CFBundleTypeName: Bzip2 Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ArchiveDocument
            LSItemContentTypes: [public.bzip2-archive]
            CFBundleTypeIconFile: DocIcon-bz2
          - CFBundleTypeName: XZ Archive
            CFBundleTypeRole: Viewer
