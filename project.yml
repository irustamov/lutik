          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            # The 27 archive types; KernirQuickLookIOS and both thumbnail extensions reuse this list (*qlTypes).
            QLSupportedContentTypes: &qlTypes [com.kernir.archive-volume, public.zip-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive, public.tar-archive, org.gnu.gnu-tar-archive, org.gnu.gnu-zip-archive, org.gnu.gnu-zip-tar-archive, public.bzip2-archive, public.tar-bzip2-archive, org.tukaani.xz-archive, org.tukaani.tar-xz-archive, com.facebook.zst-archive, public.iso-image, public.cpio-archive, com.apple.xar-archive, com.microsoft.cab, cx.c3.lha-archive, com.sun.java-archive, com.sun.web-application-archive, com.sun.enterprise-archive, com.android.package-archive, com.android.app-bundle, org.mozilla.xpinstall, org.python.wheel, org.nuget.package, com.microsoft.vsix]
        # Same declarations as the containing app: rar, lha, zst and the zip-based types are not system-declared on a clean macOS 26 / iOS 26.
        UTImportedTypeDeclarations: &qlImportsMac   # also KernirThumbnailMac
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *rarExtensions
          - UTTypeIdentifier: com.kernir.archive-volume
            UTTypeDescription: Split Archive Part
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *volumeExtensions
          - UTTypeIdentifier: com.facebook.zst-archive
            UTTypeDescription: Zstandard Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zst, tzst]
          - UTTypeIdentifier: cx.c3.lha-archive
            UTTypeDescription: LHA Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lha, lzh]
          - UTTypeIdentifier: com.sun.enterprise-archive
            UTTypeDescription: Java Enterprise Archive
            UTTypeConformsTo: [public.zip-archive, public.data, com.sun.java-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ear]
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [apk]
              public.mime-type: [application/vnd.android.package-archive]
          - UTTypeIdentifier: com.android.app-bundle
            UTTypeDescription: Android App Bundle
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aab]
          - UTTypeIdentifier: org.mozilla.xpinstall
            UTTypeDescription: Mozilla Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xpi]
              public.mime-type: [application/x-xpinstall]
          - UTTypeIdentifier: org.python.wheel
            UTTypeDescription: Python Wheel
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [whl]
          - UTTypeIdentifier: org.nuget.package
            UTTypeDescription: NuGet Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nupkg]
          - UTTypeIdentifier: com.microsoft.vsix
            UTTypeDescription: Visual Studio Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vsix]
    settings:
      base:
        # Must stay a child of KernirMac's ID: com.kernir.app.dev.quicklook in Debug.
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app$(KERNIR_BUNDLE_ID_SUFFIX).quicklook
        KERNIR_BUNDLE_ID_SUFFIX: ""
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          KERNIR_BUNDLE_ID_SUFFIX: .dev

  KernirQuickLookIOS:
    type: app-extension
    platform: iOS
    sources: [Extensions/QuickLookIOS, Extensions/Shared]
    dependencies:
      - package: KernirCore
      # Without it the appex crashes at connection time ("Unable to find NSExtensionContextClass").
      - sdk: QuickLook.framework
    info:
      path: Extensions/QuickLookIOS/Info.plist
      properties:
        CFBundleDisplayName: Lutik Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: *qlTypes
        # Same declarations as the containing app: rar, lha, zst and the zip-based types are not system-declared on a clean macOS 26 / iOS 26.
        UTImportedTypeDeclarations: &qlImportsIOS   # also KernirThumbnailIOS; adds public.iso-image
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *rarExtensions
          - UTTypeIdentifier: com.kernir.archive-volume
            UTTypeDescription: Split Archive Part
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: *volumeExtensions
          - UTTypeIdentifier: com.facebook.zst-archive
            UTTypeDescription: Zstandard Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zst, tzst]
          - UTTypeIdentifier: public.iso-image
            UTTypeDescription: ISO Disk Image
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [iso]
          - UTTypeIdentifier: cx.c3.lha-archive
            UTTypeDescription: LHA Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lha, lzh]
          - UTTypeIdentifier: com.sun.enterprise-archive
            UTTypeDescription: Java Enterprise Archive
            UTTypeConformsTo: [public.zip-archive, public.data, com.sun.java-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ear]
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [apk]
              public.mime-type: application/vnd.android.package-archive
          - UTTypeIdentifier: com.android.app-bundle
            UTTypeDescription: Android App Bundle
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aab]
          - UTTypeIdentifier: org.mozilla.xpinstall
            UTTypeDescription: Mozilla Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xpi]
              public.mime-type: application/x-xpinstall
          - UTTypeIdentifier: org.python.wheel
            UTTypeDescription: Python Wheel
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [whl]
          - UTTypeIdentifier: org.nuget.package
            UTTypeDescription: NuGet Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nupkg]
          - UTTypeIdentifier: com.microsoft.vsix
            UTTypeDescription: Visual Studio Extension
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vsix]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.quicklook

  # ---- Quick Look thumbnail extensions ----
  # One bundled picture per type (Extensions/ThumbnailAssets), picked by file name (Extensions/ThumbnailShared,
  # one provider for both). No Extensions/Shared and no KernirCore here, so the appex never reads the archive.
  KernirThumbnailMac:
    type: app-extension
    platform: macOS
    sources: [Extensions/ThumbnailMac, Extensions/ThumbnailShared, Extensions/ThumbnailAssets]
    dependencies:
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Extensions/ThumbnailMac/Info.plist
      properties:
        CFBundleDisplayName: Lutik Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: *qlTypes
            QLThumbnailMinimumDimension: 0
        UTImportedTypeDeclarations: *qlImportsMac
    settings:
      base:
        # Must stay a child of KernirMac's ID: com.kernir.app.dev.thumbnail in Debug.
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app$(KERNIR_BUNDLE_ID_SUFFIX).thumbnail
        KERNIR_BUNDLE_ID_SUFFIX: ""
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          KERNIR_BUNDLE_ID_SUFFIX: .dev

  KernirThumbnailIOS:
    type: app-extension
    platform: iOS
    sources: [Extensions/ThumbnailIOS, Extensions/ThumbnailShared, Extensions/ThumbnailAssets]
    dependencies:
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Extensions/ThumbnailIOS/Info.plist
      properties:
        CFBundleDisplayName: Lutik Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: *qlTypes
            QLThumbnailMinimumDimension: 0
        UTImportedTypeDeclarations: *qlImportsIOS
    settings:
      base:
        # A literal, like KernirQuickLookIOS: the iOS app is always com.kernir.app (KernirIOS), and a
        # suffix variable here could be overridden (KERNIR_BUNDLE_ID_SUFFIX=.dev) and break embedding.
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.thumbnail

  KernirQuickLookTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Extensions/Shared, Extensions/QuickLookMac/ArchivePreviewView.swift, Extensions/QuickLookMac/PreviewViewController.swift, Extensions/ThumbnailShared/ThumbnailArt.swift, Extensions/ThumbnailShared/ThumbnailReplyFlavor.swift, Tests/QuickLookTests]
    dependencies:
      - package: KernirCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.quicklook.tests
    scheme:
      testTargets: [KernirQuickLookTests]

  KernirQuickLookIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/QuickLookIOSUITests]
    dependencies:
      - target: KernirIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernir.app.quicklook.uitests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: [KernirQuickLookIOSUITests]

schemes:
  # ---- macOS UI tests (was the target-level `scheme:` of KernirMacUITests) ----
  # No automatic full-screen captures (screenshots, screen recordings) of the user's desktop:
  # The UI tests' evidence is explicit window shots kept with .keepAlways, which keepNever doesn't drop.
  # captureScreenshotsAutomatically: false is written as systemAttachmentLifetime = "keepNever"
  # (XcodeGen 2.46 emits nothing for a systemAttachmentLifetime key on its own).
  KernirMacUITests:
    build:
      targets:
        KernirMacUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [KernirMacUITests]
      captureScreenshotsAutomatically: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
