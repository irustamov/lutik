name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual runs are the ad-hoc dry run only (prerelease draft, no secrets).
  # Signed, notarized DMGs come only from v* tags.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (for example 0.2.0)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SIGN: ${{ github.event_name == 'workflow_dispatch' && 'adhoc' || 'developer-id' }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Signed builds only from tags
        run: |
          if [ "$SIGN" = developer-id ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::developer-id builds run only from a v* tag push, not from $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version '$VERSION'"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: |
          if [ ! -d /Applications/Xcode_26.6.app ]; then
            echo "::error::/Applications/Xcode_26.6.app not found. Installed:"
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing credentials
        if: env.SIGN == 'developer-id'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci/import-signing.sh import

      - name: Build DMG (Developer ID, notarized)
        if: env.SIGN == 'developer-id'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/release-mac.sh --version "$VERSION" --sign developer-id

      - name: Build DMG (ad-hoc dry run)
        if: env.SIGN == 'adhoc'
        run: scripts/release-mac.sh --version "$VERSION" --sign adhoc

      - name: Verify DMG
        run: |
          if [ "$SIGN" = adhoc ]; then
            scripts/verify-dmg.sh dist/Lutik.dmg --adhoc
          else
            scripts/verify-dmg.sh dist/Lutik.dmg
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=()
          if [ "$SIGN" = adhoc ]; then EXTRA+=(--prerelease); fi
          gh release create "v$VERSION" dist/Lutik.dmg dist/Lutik.dmg.sha256 \
            --title "Lutik $VERSION" --target "$GITHUB_SHA" \
            --draft --generate-notes "${EXTRA[@]}"

      - name: Remove signing credentials
        if: always()
        run: scripts/ci/import-signing.sh cleanup
